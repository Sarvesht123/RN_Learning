<VirtualHost *:80>
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/html/AdobeCommerce/pub
    ServerName aed.staging.com
    ServerAlias 31be-5-32-82-98.ngrok-free.app

    ErrorLog ${APACHE_LOG_DIR}/aed.staging.com-error.log
    CustomLog ${APACHE_LOG_DIR}/aed.staging.com-error-access.log combined

    <Directory "/var/www/html/AdobeCommerce/pub">
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    <IfModule mod_headers.c>
        SetEnvIf Origin "^http://localhost:808[0-9]$" mobile_dev_origin=$0
        Header always set Access-Control-Allow-Origin "%{mobile_dev_origin}e" env=mobile_dev_origin
        Header always set Vary "Origin"
        Header always set Access-Control-Allow-Methods "GET, POST, OPTIONS"
        Header always set Access-Control-Allow-Headers "Content-Type, Authorization, Store, X-Requested-With"
    </IfModule>

    RewriteEngine On
    RewriteCond %{REQUEST_METHOD} OPTIONS
    RewriteRule ^ - [R=204,END]
</VirtualHost>
